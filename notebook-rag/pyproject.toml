[project]
name = "notebook-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.6",
    "docling>=2.93.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "lancedb>=0.30.2",
    "openai>=2.36.0",
    "opendal>=0.47.1",
    "oss2>=2.19.1",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.18",
    "rich>=15.0.0",
    "typer>=0.21.2",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-dotenv>=0.5.2",
]

[tool.pytest.ini_options]
env_files = [".env"]
