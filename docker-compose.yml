version: "3.5"

services:
  quiz-db:
    image: pgvector/pgvector:pg16-trixie
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - medquiz_postgres_data:/var/lib/postgresql/data
    networks:
      - app

  quiz-server:
    image: crpi-isjkczwpadlvr9i3.cn-hongkong.personal.cr.aliyuncs.com/medquiz/quiz-server:latest
    restart: always
    ports:
      - "8888:8888"
    depends_on:
      - quiz-db
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@quiz-db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8888"
    networks:
      - app

  quiz-ui:
    image: crpi-isjkczwpadlvr9i3.cn-hongkong.personal.cr.aliyuncs.com/medquiz/quiz-ui:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - quiz-server
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  medquiz_postgres_data:
